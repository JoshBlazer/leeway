name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Skia needs fontconfig for the headless UI tests.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - run: dotnet restore Leeway.slnx
      - run: dotnet build Leeway.slnx -c Release --no-restore
      - run: dotnet test --solution Leeway.slnx -c Release --no-build
      - name: Check the real packages
        run: python3 scripts/package-check.py

  # The server side of the end-to-end tests, on a database with concurrent writers. See ADR-0019.
  server-on-mysql:
    name: Server tests on MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: leeway-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pleeway-ci-only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      LEEWAY_TEST_MYSQL: Server=127.0.0.1;Port=3306;User=root;Password=leeway-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test --project tests/Leeway.Integration.Tests -c Release
      - name: Check the MySQL tests notice a missing lock
        run: python3 scripts/adapter-sabotage.py --case "Servers do not lock"
      - name: Check the MySQL tests notice a missing collation check
        run: python3 scripts/adapter-sabotage.py --case "A case-insensitive database"

  sample:
    name: Build Avalonia sample (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build samples/GateKeeper.Desktop -c Release
