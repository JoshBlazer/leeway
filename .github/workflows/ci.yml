name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Skia needs fontconfig for the headless UI tests.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - run: dotnet restore Leeway.slnx
      - run: dotnet build Leeway.slnx -c Release --no-restore
      - run: dotnet test --solution Leeway.slnx -c Release --no-build
      - name: Check the real packages
        run: python3 scripts/package-check.py

  sample:
    name: Build Avalonia sample (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build samples/GateKeeper.Desktop -c Release
